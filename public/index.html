<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horror keep or drop</title>
<style>
  :root {
    --bg: #12110f;
    --card: #1c1915;
    --line: #3a342c;
    --text: #f3ece2;
    --muted: #b3a696;
    --keep: #d7e7c8;
    --keep-bg: #243226;
    --drop: #f0d2c8;
    --drop-bg: #3a2422;
    --brass: #c6a36a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.45 Georgia, "Iowan Old Style", Palatino, serif;
  }
  button, input { font: 15px/1.2 system-ui, sans-serif; }
  header.top {
    position: sticky;
    top: 0;
    z-index: 2;
    background: rgba(18, 17, 15, 0.94);
    border-bottom: 1px solid var(--line);
    padding: 16px 20px 12px;
  }
  h1 { font-size: 28px; font-weight: 500; margin: 0 0 4px; }
  .lede { margin: 0; color: var(--muted); max-width: 68ch; }
  .stats { margin: 10px 0 0; color: var(--brass); font: 14px/1.3 system-ui, sans-serif; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
  input[type="search"] {
    background: #0e0d0b;
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    min-width: min(100%, 240px);
  }
  button {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    cursor: pointer;
    min-height: 44px;
  }
  button:hover { border-color: var(--brass); }
  button[aria-pressed="true"] { border-color: var(--brass); color: var(--brass); }
  button.keep[aria-pressed="true"] { background: var(--keep-bg); color: var(--keep); border-color: #5d7a52; }
  button.drop[aria-pressed="true"] { background: var(--drop-bg); color: var(--drop); border-color: #8a4e46; }
  .toast { color: var(--brass); font: 14px system-ui, sans-serif; min-height: 1.2em; }
  nav.jump { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 20px 0; }
  nav.jump a {
    color: var(--muted);
    text-decoration: none;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 10px;
    font: 13px system-ui, sans-serif;
  }
  nav.jump a:hover { color: var(--text); border-color: var(--brass); }
  main { padding: 8px 20px 48px; max-width: 980px; }
  section.family {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    margin-top: 14px;
    padding: 14px 14px 6px;
  }
  section.family h2 { margin: 0; font-size: 22px; font-weight: 500; }
  .family-head { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
  .family-note, .movie-note { color: var(--muted); margin: 6px 0 0; font-size: 14px; }
  .family-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .movie {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: center;
    padding: 10px 0;
    border-top: 1px solid #2c2823;
  }
  .movie.keep { box-shadow: inset 3px 0 0 var(--brass); padding-left: 10px; }
  .movie.drop .title { text-decoration: line-through; color: var(--muted); }
  .title { margin: 0; font-size: 18px; font-weight: 500; }
  .year { color: var(--brass); font: 13px system-ui, sans-serif; margin-right: 8px; }
  .choices { display: flex; gap: 8px; flex-shrink: 0; }
  #kept {
    margin-top: 22px;
    padding-top: 8px;
  }
  #kept h2 { font-weight: 500; }
  #kept ul { margin: 6px 0 14px; padding-left: 18px; }
  .hidden { display: none; }
  @media (max-width: 640px) {
    .movie { align-items: flex-start; flex-direction: column; }
  }
</style>
</head>
<body>
<header class="top">
  <h1>Horror keep or drop</h1>
  <p class="lede">Mark a whole family, or one movie. A second click on the same choice clears it. Choices stay in this browser. Email Stephen downloads the list and opens a message to stephen@skyhighmedia.com.</p>
  <p class="stats" id="stats"></p>
  <div class="controls">
    <input id="q" type="search" placeholder="Search titles" aria-label="Search titles">
    <button type="button" data-filter="all" aria-pressed="true">All</button>
    <button type="button" data-filter="unset" aria-pressed="false">Undecided</button>
    <button type="button" data-filter="keep" aria-pressed="false">Kept</button>
    <button type="button" data-filter="drop" aria-pressed="false">Dropped</button>
    <button type="button" id="copy-kept">Copy kept list</button>
    <button type="button" id="copy-link">Copy link</button>
    <button type="button" id="download-file">Download file</button>
    <button type="button" id="email-stephen">Email Stephen</button>
    <button type="button" id="reset">Clear all</button>
    <span class="toast" id="toast" role="status"></span>
  </div>
</header>
<nav class="jump" id="jump"></nav>
<main>
  <div id="list"></div>
  <div id="kept"></div>
</main>

<script>
const FAMILIES = JSON.parse(document.getElementById("families").textContent);
const movieIds = new Set();
const movieInfo = new Map();
for (const family of FAMILIES) {
  for (const movie of family.movies) {
    movieIds.add(movie.id);
    if (!movieInfo.has(movie.id)) movieInfo.set(movie.id, movie);
  }
}

const STORAGE_KEY = "horror-keep-drop-v1";
let state = {};
let filter = "all";
let query = "";

function encodeState(value) {
  const bytes = new TextEncoder().encode(JSON.stringify(value));
  let bin = "";
  for (const byte of bytes) bin += String.fromCharCode(byte);
  return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
}

function decodeState(raw) {
  const pad = raw.length % 4 === 0 ? "" : "=".repeat(4 - (raw.length % 4));
  const b64 = raw.replace(/-/g, "+").replace(/_/g, "/") + pad;
  const bin = atob(b64);
  const bytes = Uint8Array.from(bin, (char) => char.charCodeAt(0));
  const data = JSON.parse(new TextDecoder().decode(bytes));
  if (!data || typeof data !== "object" || Array.isArray(data)) throw new Error("bad state");
  const clean = {};
  for (const [id, choice] of Object.entries(data)) {
    if (movieIds.has(id) && (choice === "keep" || choice === "drop")) clean[id] = choice;
  }
  return clean;
}

function loadState() {
  const hash = new URLSearchParams(location.hash.slice(1)).get("p");
  if (hash) {
    try { return decodeState(hash); } catch (error) { /* fall through */ }
  }
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
    return decodeState(encodeState(saved));
  } catch (error) {
    return {};
  }
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  const next = "#p=" + encodeState(state);
  if (location.hash !== next) history.replaceState(null, "", next);
}

function uniqueIds(family) {
  return [...new Set(family.movies.map((movie) => movie.id))];
}

function familyAggregate(family) {
  const choices = uniqueIds(family).map((id) => state[id] || "unset");
  if (choices.every((choice) => choice === "keep")) return "keep";
  if (choices.every((choice) => choice === "drop")) return "drop";
  if (choices.every((choice) => choice === "unset")) return "unset";
  return "mixed";
}

function visible(movie, family) {
  const choice = state[movie.id] || "unset";
  if (filter !== "all" && choice !== filter) return false;
  if (!query) return true;
  const hay = [family.name, movie.title, String(movie.year), movie.note || ""].join(" ").toLowerCase();
  return hay.includes(query);
}

function escapeHtml(value) {
  return value.replace(/[&<>"']/g, (char) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[char]));
}

function render() {
  const list = document.getElementById("list");
  const parts = [];
  for (const family of FAMILIES) {
    const movies = family.movies.filter((movie) => visible(movie, family));
    if (!movies.length) continue;
    const aggregate = familyAggregate(family);
    const movieHtml = movies.map((movie) => {
      const choice = state[movie.id] || "unset";
      const note = movie.note ? `<p class="movie-note">${escapeHtml(movie.note)}</p>` : "";
      return `<div class="movie ${choice === "unset" ? "" : choice}" data-id="${movie.id}">
        <div>
          <h3 class="title"><span class="year">${movie.year}</span>${escapeHtml(movie.title)}</h3>
          ${note}
        </div>
        <div class="choices">
          <button type="button" class="keep" data-set="keep" aria-pressed="${choice === "keep"}">Keep</button>
          <button type="button" class="drop" data-set="drop" aria-pressed="${choice === "drop"}">Drop</button>
        </div>
      </div>`;
    }).join("");
    const note = family.note ? `<p class="family-note">${escapeHtml(family.note)}</p>` : "";
    parts.push(`<section class="family" id="family-${family.id}">
      <div class="family-head">
        <h2>${escapeHtml(family.name)}</h2>
        <div class="family-actions">
          <button type="button" class="keep" data-family="${family.id}" data-family-set="keep" aria-pressed="${aggregate === "keep"}">Keep family</button>
          <button type="button" class="drop" data-family="${family.id}" data-family-set="drop" aria-pressed="${aggregate === "drop"}">Drop family</button>
          <button type="button" data-family="${family.id}" data-family-set="clear">Clear family</button>
        </div>
      </div>
      ${note}
      ${movieHtml}
    </section>`);
  }
  list.innerHTML = parts.join("") || `<p class="lede">Nothing matches.</p>`;

  const kept = [];
  const dropped = [];
  for (const id of movieIds) {
    if (state[id] === "keep") kept.push(id);
    if (state[id] === "drop") dropped.push(id);
  }
  document.getElementById("stats").textContent =
    `${movieIds.size} movies · ${kept.length} kept · ${dropped.length} dropped · ${movieIds.size - kept.length - dropped.length} undecided`;

  const keptRoot = document.getElementById("kept");
  const blocks = [];
  const shown = new Set();
  for (const family of FAMILIES) {
    const rows = [];
    for (const movie of family.movies) {
      if (state[movie.id] !== "keep" || shown.has(movie.id)) continue;
      shown.add(movie.id);
      rows.push(`<li>${escapeHtml(movie.title)} (${movie.year})</li>`);
    }
    if (rows.length) blocks.push(`<h3>${escapeHtml(family.name)}</h3><ul>${rows.join("")}</ul>`);
  }
  keptRoot.innerHTML = `<h2>Kept</h2>${blocks.join("") || "<p class='lede'>Nothing kept yet.</p>"}`;
}

function setMovie(id, choice) {
  if (state[id] === choice) delete state[id];
  else state[id] = choice;
}

function setFamily(familyId, choice) {
  const family = FAMILIES.find((item) => item.id === familyId);
  for (const id of uniqueIds(family)) {
    if (choice === "clear") delete state[id];
    else state[id] = choice;
  }
}

function sectionText(choice, heading) {
  const lines = [heading, ""];
  const shown = new Set();
  let any = false;
  for (const family of FAMILIES) {
    const rows = [];
    for (const movie of family.movies) {
      if (state[movie.id] !== choice || shown.has(movie.id)) continue;
      shown.add(movie.id);
      rows.push(`- ${movie.title} (${movie.year})`);
    }
    if (rows.length) {
      any = true;
      lines.push(family.name, ...rows, "");
    }
  }
  if (!any) lines.push("(none)", "");
  return { lines, count: shown.size };
}

function keptText() {
  return sectionText("keep", "Kept").lines.join("\n").trim() + "\n";
}

function picksText() {
  const kept = sectionText("keep", "Kept");
  const dropped = sectionText("drop", "Dropped");
  return {
    text: ["Horror keep or drop", "", ...kept.lines, ...dropped.lines].join("\n").trim() + "\n",
    kept: kept.count,
    dropped: dropped.count,
  };
}

function showToast(message) {
  const toast = document.getElementById("toast");
  toast.textContent = message;
  setTimeout(() => { if (toast.textContent === message) toast.textContent = ""; }, 2500);
}

function downloadText(filename, text) {
  const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = filename;
  link.click();
  URL.revokeObjectURL(url);
}

function emailStephen() {
  const picks = picksText();
  if (!picks.kept && !picks.dropped) {
    showToast("Mark at least one movie first");
    return;
  }
  const subject = "Horror keep or drop";
  const address = "stephen@skyhighmedia.com";
  let body = picks.text;
  const fullUrl = `mailto:${address}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  if (fullUrl.length > 1800) {
    downloadText("horror-picks.txt", picks.text);
    body = `Attach horror-picks.txt. ${picks.kept} kept, ${picks.dropped} dropped.\n\n${picks.text.slice(0, 700)}`;
  }
  const link = document.createElement("a");
  link.href = `mailto:${address}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  link.click();
  showToast(fullUrl.length > 1800 ? "Downloaded horror-picks.txt and opened the email" : "Opened an email to Stephen");
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
  } catch (error) {
    const area = document.createElement("textarea");
    area.value = text;
    document.body.appendChild(area);
    area.select();
    document.execCommand("copy");
    area.remove();
  }
  const toast = document.getElementById("toast");
  toast.textContent = "Copied";
  setTimeout(() => { if (toast.textContent === "Copied") toast.textContent = ""; }, 1600);
}

document.getElementById("jump").innerHTML = FAMILIES.map((family) =>
  `<a href="#family-${family.id}">${escapeHtml(family.name)}</a>`
).join("");

document.getElementById("list").addEventListener("click", (event) => {
  const movieButton = event.target.closest("[data-set]");
  if (movieButton) {
    setMovie(movieButton.closest("[data-id]").dataset.id, movieButton.dataset.set);
    saveState();
    render();
    return;
  }
  const familyButton = event.target.closest("[data-family-set]");
  if (familyButton) {
    setFamily(familyButton.dataset.family, familyButton.dataset.familySet);
    saveState();
    render();
  }
});

document.querySelector(".controls").addEventListener("click", (event) => {
  const filterButton = event.target.closest("[data-filter]");
  if (!filterButton) return;
  filter = filterButton.dataset.filter;
  for (const button of document.querySelectorAll("[data-filter]")) {
    button.setAttribute("aria-pressed", String(button === filterButton));
  }
  render();
});

document.getElementById("q").addEventListener("input", (event) => {
  query = event.target.value.trim().toLowerCase();
  render();
});

document.getElementById("copy-kept").addEventListener("click", () => copyText(keptText()));
document.getElementById("copy-link").addEventListener("click", () => copyText(location.href));
document.getElementById("download-file").addEventListener("click", () => {
  const picks = picksText();
  if (!picks.kept && !picks.dropped) {
    showToast("Mark at least one movie first");
    return;
  }
  downloadText("horror-picks.txt", picks.text);
  showToast("Downloaded horror-picks.txt");
});
document.getElementById("email-stephen").addEventListener("click", emailStephen);
document.getElementById("reset").addEventListener("click", () => {
  if (!Object.keys(state).length) return;
  if (!confirm("Clear every keep and drop?")) return;
  state = {};
  saveState();
  render();
});

state = loadState();
saveState();
render();
</script>
